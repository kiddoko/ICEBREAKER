<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICEBREAKER</title>
  </head>
  <body>
    <!--
      The whole UI is drawn on #screen as a grid of character cells.
      The other layers are cheap CSS post-effects stacked on top.
    -->
    <div id="deck">
      <canvas id="screen"></canvas>
      <canvas id="bloom"></canvas>
      <canvas id="chroma"></canvas>
      <div id="scanlines"></div>
      <div id="vignette"></div>
      <div id="paper"></div>
      <div id="curve"></div>
      <!-- Invisible textarea: receives keyboard, IME (日本語), dead keys (é, ê) and paste. -->
      <textarea id="keyboard-sink" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="ICEBREAKER input"></textarea>
      <!-- Screen readers: the deck draws in a canvas; what it says (notifications) is written here too. -->
      <div id="announce" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
