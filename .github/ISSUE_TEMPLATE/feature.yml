name: Idea
description: A feature or a change
labels: [idea]
body:
  - type: markdown
    attributes:
      value: "English or French, as you like. Most features belong in a **module** (one feature = one module). If yours could be one, say so — or build it: `plugin new <id>` and docs/PLUGINS.md."
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: The problem it solves, and how you'd use it (which command? which widget?).
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it belongs
      options: [A module, A theme, The core, Not sure]
