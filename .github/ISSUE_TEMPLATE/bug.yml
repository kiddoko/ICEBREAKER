name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "1. run `cal add …`\n2. …"
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "0.1.0 · macOS 15 · Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Shell output / error message
      render: text
