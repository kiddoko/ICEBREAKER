# Builds ICEBREAKER on macOS, Windows and Linux. The installers are attached to
# each run (Actions tab → the run → "Artifacts").
#
# Not on every push any more: Actions minutes cost money on a private repo
# (macOS minutes count 10×). It runs when you ask for it, or for a release tag:
#   gh workflow run build.yml            (or the "Run workflow" button on GitHub)
#   git tag v0.2.0 && git push --tags
#
# Every third-party action is pinned to a commit (a tag like v4 can be moved to other
# code; a commit can't), its version in a comment. To update one: the new version's
# commit from its releases page (or `git ls-remote --tags https://github.com/<owner>/<repo>`).
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # release tags build Windows + Linux only (the macOS app is built and attached by
    # hand, and macOS minutes count 10×); a manual run builds all three
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"name":"windows","os":"windows-latest","args":"--bundles nsis"},{"name":"linux","os":"ubuntu-22.04","args":"--bundles appimage,deb"}]' || '[{"name":"macos","os":"macos-latest","args":"--target universal-apple-darwin --bundles app"},{"name":"windows","os":"windows-latest","args":"--bundles nsis"},{"name":"linux","os":"ubuntu-22.04","args":"--bundles appimage,deb"}]') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-21
        with:
          # pinned by commit, the toolchain is named here (with @stable it came from the ref)
          toolchain: stable
          # a universal macOS app contains both Apple Silicon and Intel code
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
          # the sound: WebKitGTK plays through GStreamer (appsrc, autoaudiosink…) — the AppImage
          # carries these plugins (tauri.conf.json bundleMediaFramework), the .deb depends on them
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          # appimagetool checks the .desktop file again when the AppImage is rebuilt (scripts/appimage-system-glib.sh)
          sudo apt-get install -y desktop-file-utils

      - run: npm ci

      - name: Rust tests
        if: matrix.name == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ICEBREAKER's Google OAuth client (CALENDAR), from the repository secrets
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET. Without them the build still
      # works: users then bring their own client (see docs/GOOGLE.md).
      - name: Google OAuth client
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        if: env.GOOGLE_CLIENT_ID != ''
        shell: bash
        run: printf '{"client_id":"%s","client_secret":"%s"}' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > src-tauri/google-client.json

      # signed for ICEBREAKER's in-app updates (docs/UPDATES.md) when the repository has the
      # secret TAURI_SIGNING_PRIVATE_KEY: each installer gets a .sig next to it
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri -- build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run tauri -- build ${{ matrix.args }}
          fi

      # the AppImage uses the system's GLib, not Ubuntu 22.04's (Arch & co. crashed at launch:
      # g_once_init_leave_pointer) — then its updater signature is made again
      - name: AppImage with the system's GLib
        if: matrix.name == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            scripts/appimage-system-glib.sh "$f"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -f "$f.sig" ]; then
              rm -f "$f.sig"
              npm run tauri -- signer sign "$f"
            fi
          done

      # .app bundles are folders: zip them (ditto keeps permissions and symlinks)
      - name: Package macOS app
        if: matrix.name == 'macos'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent ICEBREAKER.app ICEBREAKER-macos-universal.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icebreaker-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb

      # a release tag (v0.2.0…): the installers go onto that release's page, with their
      # .sig (the in-app updates' signatures: scripts/release-update.mjs reads them from the
      # release, and signs again locally only a file that has none)
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # not "latest" yet: installed ICEBREAKERs read releases/latest/download/latest.json,
          # which only exists once scripts/release-update.mjs has added the Mac build and
          # latest.json — it then makes this release the latest
          make_latest: "false"
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
