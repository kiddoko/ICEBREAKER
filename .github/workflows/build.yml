# Builds ICEBREAKER on macOS, Windows and Linux. The installers are attached to
# each run (Actions tab → the run → "Artifacts").
#
# Not on every push any more: Actions minutes cost money on a private repo
# (macOS minutes count 10×). It runs when you ask for it, or for a release tag:
#   gh workflow run build.yml            (or the "Run workflow" button on GitHub)
#   git tag v0.2.0 && git push --tags
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app
          - name: windows
            os: windows-latest
            args: --bundles nsis
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # a universal macOS app contains both Apple Silicon and Intel code
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: npm ci

      - name: Rust tests
        if: matrix.name == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ICEBREAKER's Google OAuth client (CALENDAR), from the repository secrets
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET. Without them the build still
      # works: users then bring their own client (see docs/GOOGLE.md).
      - name: Google OAuth client
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        if: env.GOOGLE_CLIENT_ID != ''
        shell: bash
        run: printf '{"client_id":"%s","client_secret":"%s"}' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > src-tauri/google-client.json

      - name: Build
        run: npm run tauri -- build ${{ matrix.args }}

      # .app bundles are folders: zip them (ditto keeps permissions and symlinks)
      - name: Package macOS app
        if: matrix.name == 'macos'
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent ICEBREAKER.app ICEBREAKER-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: icebreaker-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
