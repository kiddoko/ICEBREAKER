[package]
name = "icebreaker"
version = "0.1.0"
description = "ICEBREAKER — open-source terminal-styled cyberdeck for notes, journaling and AI plugins"
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (Tauri convention).
name = "icebreaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
# PKCE for the Google sign-in (google.rs)
getrandom = "0.2"
sha2 = "0.10"
# local music: tags (no cover art) and playback (audio.rs)
lofty = "0.22"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
notify = "6"
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# only the CPU/memory/process part — keeps compile times and binary size down
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tiny_http = "0.12"
tauri-plugin-notification = "2"

[profile.release]
# Small, fast binary: important for the "runs on a potato laptop" goal.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
