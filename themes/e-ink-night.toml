# E-INK NIGHT — the dark mode of e-ink: cream ink on warm charcoal paper (never pure black,
# never pure white, so it stays soft on the eyes at night). Same matte screen as e-ink:
# no glow, no scanlines, pages that refresh, ink that settles in.

[meta]
name = "e-ink-night"
author = "icebreaker"
description = "e-ink for the night: cream ink on charcoal paper, soft contrast, no glow."
schema = 2                # themes v2 (docs/THEMES.md): frames in [frame] / [widget_frame]

[frame]
style = "single"

[widget_frame]
style = "line"     # widgets get a rule on top, no box

[palette]
# charcoal paper (warm, never black) and cream ink (never white); the greys are
# spaced for reading in the dark, not just e-ink turned inside out
paper    = "#201e1a"
paper2   = "#29261f"
rule     = "#3b372e"
grey3    = "#696251"
grey2    = "#938a75"
grey1    = "#bab099"
ink      = "#e2d9c2"

[ui]
bg = "paper"
panel = "paper"
panel_alt = "paper2"
highlight = "paper2"
selection = "rule"
fg = "ink"
muted = "grey1"
subtle = "grey2"
faint = "grey3"
accent = "ink"
accent_alt = "grey1"
border = "grey3"
border_focus = "ink"
title = "grey2"
title_focus = "ink"
cursor = "ink"
success = "grey1"
warning = "grey2"
error = "ink"
info = "grey1"
ambient = "grey3"
status_bg = "paper2"
status_fg = "grey1"

[syntax]
heading1 = "ink"
heading2 = "ink"
heading3 = "grey1"
bold = "ink"
italic = "grey1"
code = "grey1"
code_bg = "paper2"
link = "ink"
wikilink = "ink"
tag = "grey1"
quote = "grey2"
list = "grey1"
checkbox = "ink"
hr = "rule"
frontmatter = "grey3"

[ansi]
black = "rule"
red = "ink"
green = "grey1"
yellow = "grey2"
blue = "grey1"
magenta = "grey1"
cyan = "grey2"
white = "grey1"
bright_black = "grey3"
bright_red = "ink"
bright_green = "grey1"
bright_yellow = "grey2"
bright_blue = "grey1"
bright_magenta = "grey1"
bright_cyan = "grey2"
bright_white = "ink"

[fx]
bloom = 0
scanlines = 0
vignette = 0
flicker = false           # never, whatever the CRT setting
monochrome = true         # everything in greys, even a colourful zsh
paper = 0.22              # a lighter fibre texture: on dark paper it would grey everything
gradient = ["ink", "grey1"]

[font]
family = "IBM Plex Mono"

[glyphs]
mark = "■"
bullet = "–"
spinner = "◐◓◑◒"
todo = "☐"
done = "☒"

[background]
effect = "grain"
density = 0.5
speed = 1.0
color = "grey3"

[sound]
pack = "paper"
pitch = 1.0

[anim]
select = "brackets"
page = "eink"             # black / white refresh flash, then the ink settles
type = "ink"              # what you type fades in from grey
noise = "░▒▓"
screensaver = "paper"     # an e-reader's sleep screen: an engraving and the time, redrawn once a minute
