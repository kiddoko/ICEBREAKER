# E-INK — a matte e-paper screen. Black ink, grey shades, paper white. No CRT:
# no glow, no scanlines, no flicker. Pages refresh with a black/white flash
# and what you type settles in like ink. Sounds are dry paper taps.

[meta]
name = "e-ink"
author = "icebreaker"
description = "Matte digital ink on paper: black, white and greys, no glow, pages that refresh."
border = "single"
widget_frame = "line"     # widgets get a rule on top, no box

[palette]
paper    = "#e9e7e0"
paper2   = "#dfddd5"
rule     = "#cac7bd"
grey3    = "#a19e95"
grey2    = "#75726b"
grey1    = "#4a4843"
ink      = "#1b1a18"

[ui]
bg = "paper"
panel = "paper"
panel_alt = "paper2"
highlight = "paper2"
selection = "rule"
fg = "ink"
muted = "grey1"
subtle = "grey2"
faint = "grey3"
accent = "ink"
accent_alt = "grey1"
border = "grey3"
border_focus = "ink"
title = "grey2"
title_focus = "ink"
cursor = "ink"
success = "grey1"
warning = "grey2"
error = "ink"
info = "grey1"
ambient = "grey3"
status_bg = "paper2"
status_fg = "grey1"

[syntax]
heading1 = "ink"
heading2 = "ink"
heading3 = "grey1"
bold = "ink"
italic = "grey1"
code = "grey1"
code_bg = "paper2"
link = "ink"
wikilink = "ink"
tag = "grey1"
quote = "grey2"
list = "grey1"
checkbox = "ink"
hr = "rule"
frontmatter = "grey3"

[ansi]
black = "ink"
red = "ink"
green = "grey1"
yellow = "grey2"
blue = "grey1"
magenta = "grey1"
cyan = "grey2"
white = "grey3"
bright_black = "grey2"
bright_red = "ink"
bright_green = "grey1"
bright_yellow = "grey2"
bright_blue = "grey1"
bright_magenta = "grey1"
bright_cyan = "grey2"
bright_white = "grey3"

[fx]
bloom = 0
scanlines = 0
vignette = 0
flicker = false           # never, whatever the CRT setting
gradient = ["ink", "grey1"]

[font]
family = "IBM Plex Mono"

[glyphs]
mark = "■"
bullet = "–"
spinner = "◐◓◑◒"
todo = "☐"
done = "☒"

[background]
effect = "grain"
density = 0.5
speed = 1.0
color = "grey3"

[sound]
pack = "paper"
pitch = 1.0

[anim]
select = "brackets"
page = "eink"             # black / white refresh flash, then the ink settles
type = "ink"              # what you type fades in from grey
noise = "░▒▓"
