# PHOSPHOR — a 1983 green-screen terminal. VT323 pixel font, P1 phosphor glow.

[meta]
name = "phosphor"
author = "icebreaker"
description = "Green P1 phosphor, pixel font, a terminal from 1983."
border = "single"

[palette]
black  = "#020a04"
deep   = "#04120a"
dark   = "#0a2414"
dim    = "#145a2c"
mid    = "#1f8a44"
green  = "#33ff66"
bright = "#a8ffbf"
amber  = "#ffcc33"
red    = "#ff5544"

[ui]
bg = "black"
panel = "deep"
panel_alt = "dark"
highlight = "dark"
selection = "#0f3a1e"
fg = "green"
muted = "mid"
subtle = "dim"
faint = "#0e3018"
accent = "bright"
accent_alt = "green"
border = "dim"
border_focus = "green"
title = "mid"
title_focus = "bright"
cursor = "green"
success = "green"
warning = "amber"
error = "red"
info = "bright"
ambient = "#062a12"
status_bg = "dark"
status_fg = "mid"

[syntax]
heading1 = "bright"
heading2 = "green"
heading3 = "mid"
bold = "bright"
italic = "green"
code = "bright"
code_bg = "dark"
link = "bright"
wikilink = "bright"
tag = "green"
quote = "mid"
list = "green"
checkbox = "bright"
hr = "dim"
frontmatter = "dim"

[ansi]
black = "dim"
red = "red"
green = "green"
yellow = "amber"
blue = "mid"
magenta = "bright"
cyan = "green"
white = "green"
bright_black = "mid"
bright_red = "red"
bright_green = "bright"
bright_yellow = "amber"
bright_blue = "green"
bright_magenta = "bright"
bright_cyan = "bright"
bright_white = "bright"

[fx]
bloom = 0.5
scanlines = 0.18
vignette = 0.6
gradient = ["green", "bright"]

[font]
family = "VT323"
scale = 1.3
weights = [400, 400]

[glyphs]
mark = "►"
bullet = ">"
spinner = "|/-\\"
todo = "[ ]"
done = "[x]"
